name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build -w packages/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web application
        run: npm run build -w apps/web

      - name: Test
        env:
          NODE_ENV: test
          PORT: 3000
          MONGO_URL: mongodb://localhost:27017/messpulse_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-jwt-secret-long-enough
          JWT_EXPIRES_IN: 7d
          INGEST_KEY: ci-test-ingest-key
          MAILER_PROVIDER: console
          OTP_ALLOWED_DOMAINS: college.edu
          DEFAULT_MESS_ID: mess-default
          ALLOW_SIMULATOR: "true"
        run: npm test
